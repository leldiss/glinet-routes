name: Update Twitch routing variant
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Xray destination list"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/update-twitch-routes.yml
      - update_twitch_routes.py
      - routes-xray.txt

permissions:
  contents: write
concurrency:
  group: update-router-subscription
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build from the current Xray subscription
        run: python3 -B update_twitch_routes.py
      - name: Publish updated subscription
        run: |
          git add routes-xray-twitch.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Twitch routing variant"
          git push
