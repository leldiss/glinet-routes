name: Update router subscription
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - update.ps1
      - direct.txt
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-router-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge current sources
        shell: pwsh
        run: ./update.ps1
      - name: Publish changes
        run: |
          git add routes.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update router subscription"
          git push
